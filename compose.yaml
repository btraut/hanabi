services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hanabi
      POSTGRES_PASSWORD: hanabi
      POSTGRES_USER: hanabi
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hanabi -d hanabi']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - hanabi-postgres:/var/lib/postgresql/data

volumes:
  hanabi-postgres:

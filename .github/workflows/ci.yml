name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NX_DAEMON: 'false'
      TEST_DATABASE_URL: postgres://hanabi:hanabi@localhost:5432/hanabi_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hanabi
          POSTGRES_PASSWORD: hanabi
          POSTGRES_DB: hanabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hanabi -d hanabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Prepare test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run tests
        run: pnpm test
      - name: Build web and server
        run: pnpm build
